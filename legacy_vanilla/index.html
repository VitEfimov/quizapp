<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Mastery Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <div class="citi-header-bar">
      <div class="citi-logo-text">citi</div>
      <div class="citi-red-arc"></div>
    </div>

    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <main class="quiz-container">
      <header class="quiz-header">
        <h1>Python Mastery</h1>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="score-board">
          <span id="current-question-num">1</span> / <span id="total-questions">0</span>
        </div>
      </header>

      <div class="question-container">
        <h2 id="question-text">Loading...</h2>
      </div>

      <div class="options-container" id="options-container">
        <!-- Options will be injected here -->
      </div>

      <div class="controls">
        <button id="prev-btn" class="btn btn-secondary" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
          Prev
        </button>
        <button id="shuffle-btn" class="btn btn-icon" title="Shuffle Questions">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h20" />
            <path d="m13 18 3 3-3 3" />
            <path d="m13 6 3-3-3-3" />
            <path d="M22 12A10 10 0 0 0 12 2v10z" />
          </svg>
        </button>
        <button id="next-btn" class="btn btn-primary">
          Next
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>

</html>
